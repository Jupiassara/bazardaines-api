    <style>
      /* CORREÇÃO iOS: Impede zoom no input e resize do viewport */
      html {
        height: 100dvh;
        overflow: hidden;
      }
      body {
        height: 100dvh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-y: contain;
      }
      /* Impede zoom automático do iOS quando clica no input */
      input[type="text"], 
      input[type="search"] {
        font-size: 16px !important;
      }
    </style>
  </head>
